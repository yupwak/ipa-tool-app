name: build-ios

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          set -e
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XCODEGEN=xcodegen" >> "$GITHUB_ENV"; xcodegen --version; exit 0
          fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen >/dev/null 2>&1 || true
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XCODEGEN=xcodegen" >> "$GITHUB_ENV"; xcodegen --version; exit 0
          fi
          URL=$(curl -fsSL https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest \
            | jq -r '.assets[] | select(.name | test("xcodegen.*\\.zip")) | .browser_download_url' | head -1)
          curl -fsSL -o /tmp/xcodegen.zip "$URL"
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xg
          BIN=$(find /tmp/xg -type f -name xcodegen | head -1)
          chmod +x "$BIN"
          echo "XCODEGEN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Generate app icon
        run: node tools/mkicon.mjs IpaTool/Assets.xcassets/AppIcon.appiconset/icon1024.png

      - name: Generate Xcode project
        run: $XCODEGEN generate --spec project.yml

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project IpaTool.xcodeproj \
            -scheme IpaTool \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/IpaTool.app
          ls -la "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry "$GITHUB_WORKSPACE/IpaTool-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh IpaTool-unsigned.ipa
          unzip -l IpaTool-unsigned.ipa | head -6

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            IpaTool-unsigned.ipa
            build.log
